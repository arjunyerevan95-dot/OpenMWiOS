name: OpenMW-iOS
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  OpenMW:
    type: application
    platform: iOS
    sources:
      - path: OpenMW
        # settings.cfg: staged into OpenMW.app/engine by the resources script; AppIcon.png: the default APP_ICON
        excludes: ["settings.cfg", "AppIcon.png"]
      # APP_ICON (ios/build.config), written by ios/build.sh
      - path: ../DerivedData/AppIcon.xcassets
    dependencies:
      - framework: ../ios-deps/artifacts/SDL2.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/SDL2main.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Mesa.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/MoltenVK.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/OpenSceneGraph.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/libpng.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/libjpeg.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/freetype.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/LZ4.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Boost.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/yaml-cpp.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Bullet.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/MyGUI.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/RecastNavigation.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/ICU.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/LuaJIT.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/FFmpeg.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/OpenAL.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
        weak: true
      - sdk: CoreMotion.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: GameController.framework
        weak: true
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
    postBuildScripts:
      # OpenMW's local config, settings defaults and resources, staged by its CMake build, and the iOS settings
      # defaults (loaded as additional defaults from the local config dir) -> OpenMW.app/engine
      - name: OpenMW resources
        basedOnDependencyAnalysis: false
        # declared so code signing re-runs after it (a changed resource would break the seal otherwise)
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/engine"]
        script: |
          set -e
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/engine"
          mkdir -p "$dest"
          rsync -a --delete "$OPENMW_BUILD_DIR/resources" "$OPENMW_BUILD_DIR/openmw.cfg" \
              "$OPENMW_BUILD_DIR/defaults.bin" "$OPENMW_BUILD_DIR/gamecontrollerdb.txt" "$SRCROOT/OpenMW/settings.cfg" \
              "$dest/"
      # license notices: the dependencies' (staged by ios-deps/build-deps.sh), OpenMW's license and authors, and the
      # index with the notices of third-party code in OpenMW's tree -> OpenMW.app/licenses
      - name: License notices
        basedOnDependencyAnalysis: false
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/licenses"]
        script: |
          set -e
          deps="$SRCROOT/../ios-deps/artifacts/licenses"
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/licenses"
          [ -d "$deps" ] || { echo "error: $deps missing (ios-deps/build-deps.sh build all)"; exit 1; }
          mkdir -p "$dest/OpenMW"
          rsync -a --delete --exclude /README.txt --exclude /OpenMW/ "$deps/" "$dest/"
          rsync -a "$SRCROOT/licenses/README.txt" "$dest/"
          rsync -a "$SRCROOT/../LICENSE" "$SRCROOT/../AUTHORS.md" "$dest/OpenMW/"
    settings:
      base:
        PRODUCT_NAME: OpenMW
        INFOPLIST_FILE: OpenMW/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # increased memory limit (automatic signing adds the capability to the App ID)
        CODE_SIGN_ENTITLEMENTS: OpenMW/OpenMW.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # OpenMW's static libraries (CMake build by ios/build.sh), SDL_main in libopenmw.a
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(OPENMW_BUILD_DIR)/lib"]
        # as OpenMW links on Apple (OSG plugins register themselves in static initializers). Release dead-strips
        # unreferenced objects, and ld ignores unresolved/duplicate symbols that only stripped code references
        OTHER_LDFLAGS: ["$(inherited)", "-all_load", "-lopenmw", "-lopenmw-lib", "-lcomponents", "-lmaskedoc",
                        "-losg-ffmpeg-videoplayer", "-loics", "-llocal_tinyxml", "-lsmhasher", "$(METALFX_LDFLAGS)"]
        # MetalFX upscaling (apps/openmw/ios/metalfx.mm); the simulator SDK has no MetalFX
        "METALFX_LDFLAGS[sdk=iphoneos*]": ["-framework", "MetalFX"]
        # overridden by ios/build.sh; PRODUCT_BUNDLE_IDENTIFIER, DEVELOPMENT_TEAM and APP_DISPLAY_NAME (Info.plist)
        # come only from it (ios/build.config)
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        OPENMW_BUILD_DIR: ""
      configs:
        Debug:
          OTHER_CFLAGS: ["$(inherited)", "-fno-standalone-debug"]
        # strips the app binary in plain builds too (Xcode strips only when installing); the dSYM keeps the symbols
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
    scheme: {}
