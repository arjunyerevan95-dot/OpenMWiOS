# iOS settings defaults, loaded on top of OpenMW's own (settings-default.cfg); Documents/Config/settings.cfg overrides them.

[GUI]
# Menu and text scale. The stock gameplay HUD uses 1.2 as its reference before applying its own scale.
scaling factor = 1.2

[Video]
# 60 instead of 300: at the display's 120 Hz an iPad heats up within minutes and throttles
framerate limit = 60
