name: Build iOS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: openmw-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-build:
    name: Clean gated arm64 iPhone build
    runs-on: macos-15-intel
    timeout-minutes: 180

    env:
      CONFIGURATION: Release
      IOS_DEPLOYMENT_TARGET: "16.3"
      VCPKG_TRIPLET: arm64-ios-openmw-release
      VCPKG_BINARY_SOURCES: clear
      PRODUCT_BUNDLE_IDENTIFIER: org.openmw.ios

    steps:
      - name: Check out port repository
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        run: mkdir -p build/diagnostics

      - name: Select pinned Xcode
        run: |
          set -o pipefail
          {
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-path
            xcrun --sdk iphoneos --show-sdk-version
          } 2>&1 | tee build/diagnostics/xcode-environment.log

      - name: Install validation and build tools
        run: |
          set -o pipefail
          brew install cmake ninja autoconf automake libtool pkg-config nasm yasm shellcheck ruby \
            2>&1 | tee build/diagnostics/install-tools.log

      # Downloaded source archives are safe to reuse. No installed libraries,
      # staged prefixes, generated projects, or object files are restored.
      - name: Restore source download cache
        id: source-download-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/vcpkg-pinned/downloads
          key: ios-source-downloads-v3-${{ hashFiles('versions.env', 'vcpkg.json') }}

      - name: Gate 1 - validate pinned sources and patch series
        run: |
          set -o pipefail
          ./scripts/bootstrap.sh 2>&1 | tee build/bootstrap.log
          ./scripts/validate-source.sh 2>&1 | tee build/diagnostics/source-validation.log
          cmake -S validation -B build/validation -DPORT_ROOT="$PWD" \
            2>&1 | tee build/diagnostics/cmake-validation.log

      - name: Gate 2 - clean deterministic dependency build and configure
        run: |
          set -euo pipefail
          rm -rf build/vcpkg_installed build/gl4es-ios build/luajit-ios build/prefix build/ios build/device build/artifacts
          set -o pipefail
          ./scripts/build-ios.sh 2>&1 | tee build/configure.log
          xcodebuild -list -project build/ios/OpenMW.xcodeproj \
            > build/diagnostics/generated-targets.txt

      - name: Gate 3 - verify dependencies, deployment targets, and registrars
        run: |
          set -o pipefail
          cmake --build build/ios --config "$CONFIGURATION" --target osgdb_bmp osgdb_dds osgdb_freetype osgdb_jpeg osgdb_osg osgdb_png osgdb_serializers_osg osgdb_tga --parallel 4 2>&1 | tee build/plugin-build.log
          ./scripts/validate-ios-dependencies.sh \
            2>&1 | tee build/diagnostics/dependency-validation.log

      - name: Gate 4 - link complete iOS dependency smoke target
        run: |
          set -o pipefail
          xcodebuild -project build/ios/OpenMW.xcodeproj -target openmw-ios-link-smoke -configuration "$CONFIGURATION" -sdk iphoneos -jobs 4 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/link-smoke.log

          SMOKE_BINARY="$(find build/ios -type f -path '*openmw-ios-link-smoke.app/openmw-ios-link-smoke' -print -quit)"
          test -n "$SMOKE_BINARY"
          ./scripts/verify-linked-product.sh "$SMOKE_BINARY"
          ./scripts/dependency-inventory.py
          find build/ios -name 'openmw-ios-link-smoke.map' -exec cp {} build/diagnostics/ \;

      - name: Gate 5 - compile and link full OpenMW app
        run: |
          set -o pipefail
          xcodebuild -project build/ios/OpenMW.xcodeproj -target openmw -configuration "$CONFIGURATION" -sdk iphoneos -jobs 4 -resultBundlePath build/OpenMW.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/xcodebuild.log

          rm -rf build/device
          mkdir -p build/device
          APP_PATH="$(find build/ios -type d -name 'openmw.app' -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" build/device/
          find build/ios -name 'openmw-link.map' -exec cp {} build/diagnostics/ \;

      - name: Gate 6 - verify bundle and package unsigned IPA
        run: |
          set -euo pipefail
          if grep -E "built for newer .*iOS.*version|deployment target.*newer" build/configure.log build/plugin-build.log build/link-smoke.log build/xcodebuild.log; then
            echo "error: deployment-target mismatch warning detected" >&2
            exit 1
          fi
          ./scripts/verify-bundle.sh build/device/openmw.app
          ./scripts/package-unsigned.sh
          unzip -l build/artifacts/OpenMW-iOS-unsigned.ipa \
            > build/diagnostics/ipa-contents.txt
          unzip -Z1 build/artifacts/OpenMW-iOS-unsigned.ipa \
            | grep -q '^Payload/OpenMW.app/openmw$'

      - name: Upload verified unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-iOS-unsigned-${{ github.run_number }}
          path: |
            build/artifacts/OpenMW-iOS-unsigned.ipa
            build/artifacts/OpenMW.app
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Collect detailed diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/diagnostics
          {
            echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Workflow run: ${GITHUB_RUN_ID:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            uname -a
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos clang --version
            cmake --version
            git --version
          } > build/diagnostics/environment.txt 2>&1

          if [[ -d deps/openmw/.git ]]; then
            {
              echo "OpenMW HEAD: $(git -C deps/openmw rev-parse HEAD)"
              git -C deps/openmw status --short
            } > build/diagnostics/openmw-patch-state.txt 2>&1
          fi
          if [[ -f build/ios/CMakeCache.txt ]]; then
            cmake -N -LAH build/ios > build/diagnostics/cmake-cache-expanded.txt 2>&1
          fi
          if [[ -d build/ios/OpenMW.xcodeproj ]]; then
            xcodebuild -list -project build/ios/OpenMW.xcodeproj \
              > build/diagnostics/xcode-project-list.txt 2>&1
          fi
          find build/ios -maxdepth 5 -type f -print \
            > build/diagnostics/ios-build-files.txt 2>&1
          exit 0

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-iOS-diagnostics-${{ github.run_number }}
          path: |
            build/bootstrap.log
            build/configure.log
            build/plugin-build.log
            build/link-smoke.log
            build/xcodebuild.log
            build/diagnostics
            build/OpenMW.xcresult
            build/ios/CMakeCache.txt
            build/ios/CMakeFiles/CMakeConfigureLog.yaml
            build/ios/OpenMW.xcodeproj
          if-no-files-found: warn
          retention-days: 14

      - name: Save source download cache
        if: always() && steps.source-download-cache.outputs.cache-hit != 'true' && hashFiles('deps/vcpkg-pinned/downloads/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/vcpkg-pinned/downloads
          key: ${{ steps.source-download-cache.outputs.cache-primary-key }}
