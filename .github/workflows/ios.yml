name: Build iOS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"
      - "port/**"
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: openmw-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-build:
    name: arm64 iPhone build
    # vcpkg's ICU cross-build misdetects arm64 iOS as native when the host is
    # also arm64. The Intel runner gives autoconf distinct build/host triples.
    runs-on: macos-15-intel
    timeout-minutes: 180

    env:
      CONFIGURATION: Release
      IOS_DEPLOYMENT_TARGET: "15.0"
      VCPKG_TRIPLET: arm64-ios-release

    steps:
      - name: Check out port repository
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        run: mkdir -p build/diagnostics

      - name: Select Xcode
        run: |
          set -o pipefail
          {
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-path
            xcrun --sdk iphoneos --show-sdk-version
          } 2>&1 | tee build/diagnostics/xcode-environment.log

      - name: Install build tools
        run: |
          set -o pipefail
          brew install cmake ninja autoconf automake libtool pkg-config nasm yasm \
            2>&1 | tee build/diagnostics/install-tools.log

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            build/gl4es-ios
            build/luajit-ios
            build/prefix
            deps/vcpkg-pinned/downloads
            ~/.cache/vcpkg/archives
          key: ios-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'versions.env', 'patches/openmw/*.patch') }}
          restore-keys: |
            ios-deps-${{ runner.os }}-${{ runner.arch }}-
          save-always: true

      - name: Fetch and patch pinned sources
        run: |
          set -o pipefail
          ./scripts/bootstrap.sh 2>&1 | tee build/bootstrap.log

      - name: Generate Xcode project
        run: |
          set -o pipefail
          ./scripts/build-ios.sh 2>&1 | tee build/configure.log

      - name: Compile unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project build/ios/OpenMW.xcodeproj \
            -target openmw \
            -configuration "${CONFIGURATION}" \
            -sdk iphoneos \
            -jobs 4 \
            -resultBundlePath build/OpenMW.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="${PWD}/build/device" \
            2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: ./scripts/package-unsigned.sh

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-iOS-unsigned-${{ github.run_number }}
          path: |
            build/artifacts/OpenMW-iOS-unsigned.ipa
            build/artifacts/OpenMW.app
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Collect detailed diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/diagnostics

          {
            echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Workflow run: ${GITHUB_RUN_ID:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo
            uname -a
            sw_vers
            sysctl -n machdep.cpu.brand_string
            echo
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-path
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos clang --version
            cmake --version
            ninja --version
            git --version
          } > build/diagnostics/environment.txt 2>&1

          if [[ -d deps/openmw/.git ]]; then
            {
              echo "OpenMW HEAD: $(git -C deps/openmw rev-parse HEAD)"
              echo
              git -C deps/openmw status --short
              echo
              for patch_file in patches/openmw/*.patch; do
                echo "===== ${patch_file} ====="
                git -C deps/openmw apply --check --verbose "${PWD}/${patch_file}"
              done
            } > build/diagnostics/openmw-patch-state.txt 2>&1
          fi

          if [[ -d deps/gl4es/.git ]]; then
            {
              echo "GL4ES HEAD: $(git -C deps/gl4es rev-parse HEAD)"
              echo
              git -C deps/gl4es status --short
            } > build/diagnostics/gl4es-state.txt 2>&1
          fi

          if [[ -f build/ios/CMakeCache.txt ]]; then
            cmake -N -LAH build/ios > build/diagnostics/cmake-cache-expanded.txt 2>&1
          fi

          if [[ -d build/ios/OpenMW.xcodeproj ]]; then
            xcodebuild -list -project build/ios/OpenMW.xcodeproj \
              > build/diagnostics/xcode-project-list.txt 2>&1
          fi

          find build/ios -maxdepth 4 -type f -print \
            > build/diagnostics/ios-build-files.txt 2>&1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-iOS-diagnostics-${{ github.run_number }}
          path: |
            build/bootstrap.log
            build/configure.log
            build/xcodebuild.log
            build/diagnostics
            build/OpenMW.xcresult
            build/ios/CMakeCache.txt
            build/ios/CMakeFiles/CMakeConfigureLog.yaml
            build/ios/CMakeFiles/CMakeError.log
            build/ios/CMakeFiles/CMakeOutput.log
            build/ios/OpenMW.xcodeproj
          if-no-files-found: error
          retention-days: 14
