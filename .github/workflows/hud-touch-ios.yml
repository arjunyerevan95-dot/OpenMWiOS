          "$(brew --prefix openssl@3)/bin/openssl" cms -encrypt -aes-256-gcm -binary -stream -outform DER \
            -in "${ipa[0]}" -out hud-artifact/OpenMW-HUD-Trial-unsigned.ipa.cms "$RUNNER_TEMP/hud-recipient.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMW-HUD-Trial-Encrypted-${{ github.run_id }}
          path: hud-artifact/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
