name: OpenMW iOS HUD and touch inventory trial
on:
  push:
    branches: [codex/hud-deck-touch-1126, codex/deckwind-ios-1126]
permissions:
  contents: read
concurrency:
  group: openmw-hud-deck-touch-1126
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'arjunyerevan95-dot/OpenMWiOS' && contains(github.event.head_commit.message, '[hud-touch-build]')
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify baseline and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          git merge-base --is-ancestor 4246357006c3a96fac91a2d84910fcb86549502c HEAD
          git diff --exit-code 4246357 HEAD -- ios-deps build-ios.sh ios/project.yml
      - name: Install build tools
        shell: bash
        run: |
          brew install cmake ninja meson xcodegen pkgconf python@3.14 bison@3.8
          echo "$(brew --prefix python@3.14)/libexec/bin" >> "$GITHUB_PATH"
      - name: Build and verify unsigned arm64 IPA
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'APP_NAME=OpenMW Zink Touch' 'BUNDLE_ID=org.openmw.ios.zinktouch' > ios/build.config
          ./build-ios.sh build device --release --unsigned
          test -f DerivedData/Build/Products/Release-iphoneos/OpenMW.app/engine/resources/vfs/openmw-ios-deckwind.omwscripts
          ./build-ios.sh ipa --release --unsigned
          app=DerivedData/Build/Products/Release-iphoneos/OpenMW.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = org.openmw.ios.zinktouch
          test "$(lipo -archs "$app/OpenMW")" = arm64
          test ! -e "$app/embedded.mobileprovision"
          test ! -e "$app/_CodeSignature"
          ipa=(DerivedData/ipa/*-unsigned.ipa)
          test "${#ipa[@]}" = 1
          test -f "${ipa[0]}"
          mkdir -p hud-artifact
          shasum -a 256 "${ipa[0]}" | awk '{print $1}' > hud-artifact/ipa.sha256
          git rev-parse HEAD > hud-artifact/source.txt
          cat > "$RUNNER_TEMP/hud-recipient.pem" <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEKzCCApOgAwIBAgIUTAb0mqBbHlwOix8F2y6BgnCK3Q4wDQYJKoZIhvcNAQEL
          BQAwJTEjMCEGA1UEAwwaT3Blbk1XIEhVRCBCdWlsZCBUcmFuc3BvcnQwHhcNMjYx
